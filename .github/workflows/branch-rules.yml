name: Branch Rules

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Validate merge rules
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          echo "Base: $BASE"
          echo "Head: $HEAD"