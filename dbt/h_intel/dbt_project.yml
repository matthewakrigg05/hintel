name: h_intel

profile: h_intel

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Local seed data is kept in source-specific schemas in the bronze catalog.
  h_intel:
    land_registry:
      +database: bronze
      +schema: land_registry
    ons:
      +database: bronze
      +schema: ons
    epc:
      +database: bronze
      +schema: epc

models:
  h_intel:
    +static_analysis: strict
    # Bronze contains source declarations for ingestion-owned raw tables.
    # Materialize Silver as views and both Gold layers as tables.
    silver:
      +materialized: view
      +database: silver
      +schema: staging
    gold_analytics:
      +materialized: table
      +database: gold
      +schema: analytics
    gold_serving:
      +materialized: table
      +database: gold
      +schema: serving
